# =============================================================================
# controlled-credit-risk-mlops — central configuration
# Single source of truth for data, features, model, serving, monitoring and the
# business impact model. Data source: Hugging Face (Home Credit Default Risk).
# =============================================================================

random_seed: 42

# ---------------------------------------------------------------------------
# Data source + ingestion
# ---------------------------------------------------------------------------
data:
  source: huggingface            # huggingface (default) | synthetic (offline fallback)
  huggingface:
    repo_id: deburky/home-credit-credit-risk-model-stability
    filename: home_credit_processed.parquet
    sample_size: 60000           # reproducible subset for fast iteration (null = full 522k)
  raw_path: data/raw/applicants.parquet
  processed_path: data/processed/applicants_processed.parquet
  train_path: data/processed/train.parquet
  test_path: data/processed/test.parquet
  drift_reference_path: data/drift_reference/reference.parquet
  test_size: 0.2
  numeric_features:
    - age
    - income
    - credit_amount
    - total_debt
    - current_debt
    - num_active_credits
    - num_credit_inquiries
    - recent_applications
    - max_dpd_12m
    - num_installments
  categorical_features:
    - sex
    - education
    - income_type
    - family_status
    - employment_duration
  id_column: case_id
  target_column: default_flag

# ---------------------------------------------------------------------------
# Feature engineering
# ---------------------------------------------------------------------------
features:
  numeric_features:
    - age
    - income
    - credit_amount
    - total_debt
    - current_debt
    - num_active_credits
    - num_credit_inquiries
    - recent_applications
    - max_dpd_12m
    - num_installments
  categorical_features:
    - sex
    - education
    - income_type
    - family_status
    - employment_duration
  # Engineered ratios derived from raw numerics (defined in features.engineering)
  engineered:
    - debt_to_income        # total_debt / income
    - credit_to_income      # credit_amount / income
    - inquiry_intensity     # num_credit_inquiries / (num_active_credits + 1)
    - dpd_flag              # 1 if max_dpd_12m > 0 else 0

# ---------------------------------------------------------------------------
# Model training + selection
# ---------------------------------------------------------------------------
model:
  candidates:
    - logreg
    - gbdt
    - xgboost
  cv_folds: 5
  scoring: roc_auc
  logreg:
    C: 1.0
    max_iter: 500
  gbdt:
    n_estimators: 150
    learning_rate: 0.06
    max_depth: 3
    subsample: 0.9
    random_state: 42
  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    subsample: 0.9
    colsample_bytree: 0.9
    random_state: 42

# ---------------------------------------------------------------------------
# MLflow tracking + registry
# ---------------------------------------------------------------------------
mlflow:
  tracking_uri: sqlite:///mlflow.db
  registry_uri: sqlite:///mlflow.db
  experiment_name: credit_risk_pd
  registry_model_name: credit_risk_pd_model
  artifact_location: mlruns

# ---------------------------------------------------------------------------
# Serving
# ---------------------------------------------------------------------------
serving:
  host: 0.0.0.0
  port: 8000
  model_stage: Production
  default_threshold: 0.5
  decision_labels:
    decline: DECLINE
    approve: APPROVE

# ---------------------------------------------------------------------------
# Monitoring — drift + performance + audit
# ---------------------------------------------------------------------------
monitoring:
  drift:
    psi_warn: 0.1
    psi_fail: 0.25
    ks_alpha: 0.05
  performance:
    min_roc_auc: 0.70
    max_default_rate_drift: 0.02
    min_precision: 0.25
  audit:
    log_path: data/processed/audit.jsonl

# ---------------------------------------------------------------------------
# Business impact model  (Expected Loss = PD * LGD * EAD)
# Tuned to the Home Credit scale (mean credit amount ~ 75k currency units).
# ---------------------------------------------------------------------------
business:
  lgd: 0.50
  ead: 50000
  cost_false_positive: 3000
  false_negative_cost_multiple: 1.0
