[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-mlops"
version = "0.1.0"
description = "Controlled, production-grade credit risk (probability-of-default) scoring with full MLOps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Credit Risk MLOps" }]
keywords = ["credit-risk", "mlops", "mlflow", "fastapi", "monitoring", "azure"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.100",
  "uvicorn[standard]>=0.20",
  "mlflow>=2.8",
  "shap>=0.43",
  "pyarrow>=12.0",
  "xgboost>=2.0",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-mock>=3.10",
  "pytest-asyncio>=0.21",
  "ruff>=0.1",
  "pre-commit>=3.5",
]

[project.urls]
Repository = "https://github.com/your-handle/controlled-credit-risk-mlops"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mlruns", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"notebooks/*" = ["E402"]
"docs/*" = ["E402"]

[tool.coverage.run]
source = ["src/credit_risk"]
omit = ["*/tests/*"]
