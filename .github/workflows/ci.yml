name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install httpx matplotlib

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

  end-to-end:
    name: Train → serve → smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install httpx matplotlib

      - name: Download data (Hugging Face)
        run: python -m credit_risk.data.huggingface

      - name: Ingest
        run: python -m credit_risk.data.ingestion

      - name: Train + register champion
        run: python -m credit_risk.models.train

      - name: Assert metrics + Production model
        run: |
          test -f data/processed/model_metrics.json
          python -c "from credit_risk.models import registry; v=registry.production_version(); assert v is not None, 'no Production version'; print('Production version', v)"

      - name: Smoke test the API
        run: |
          python -m credit_risk.serving.app &
          API_PID=$!
          sleep 12
          curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -s -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":40,"annual_income":70000,"months_employed":60,"num_open_accounts":3,"num_credit_inquiries_12m":0,"total_debt":8000,"credit_limit":20000,"missed_payments_12m":0,"credit_card_balance":1500,"employment_status":"Employed","home_ownership":"Mortgage","loan_purpose":"home_improvement","region":"Capital"}' | grep -q 'pd_score'
          kill $API_PID

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-risk-mlops:ci .
