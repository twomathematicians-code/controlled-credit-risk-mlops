# Conda environment for the AML training/serve image (see deployment/azure/README.md).
name: credit-risk
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy>=1.24
      - pandas>=2.0
      - scikit-learn>=1.3
      - scipy>=1.10
      - pyyaml>=6.0
      - pydantic>=2.0
      - pydantic-settings>=2.0
      - fastapi>=0.100
      - uvicorn[standard]>=0.20
      - mlflow>=2.8
      - shap>=0.43
      - pyarrow>=12.0
      - azure-ai-ml>=1.13
      - azure-identity>=1.15
